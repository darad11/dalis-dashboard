<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dali’s Dashboard Konzept</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Konzept-Prototyp: Beispieldaten im Browser, keine Verbindung zu Supabase, keine Anmeldung. -->
<div class="demo-banner" role="note">Prototyp mit Beispieldaten <span>· nichts wird gespeichert oder synchronisiert · Demo-Zeit: Mittwoch, 14. Oktober 2026, <b id="demoClock">09:40</b></span></div>
<div class="stage" id="stage" lang="de">
  <div class="app" id="app">
    <div class="scroller" id="scroller">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">d.</span><span>Dali’s Dashboard</span><span class="tag">Konzept</span></div>
        <nav class="nav" id="nav" aria-label="Bereiche"></nav>
        <div class="topbar-right">
          <div class="seg" id="deviceSeg" role="group" aria-label="Darstellung">
            <button type="button" data-device="desktop" aria-pressed="true">Desktop</button>
            <button type="button" data-device="phone" aria-pressed="false">iPhone</button>
          </div>
          <button type="button" class="icon-btn" id="btnWorkflows" data-action="open-workflows">Workflows</button>
          <button type="button" class="icon-btn" id="btnVariants" data-action="open-panel">Varianten</button>
        </div>
      </header>
      <main class="view" id="view"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Bereiche"></nav>
    <div id="layer"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
